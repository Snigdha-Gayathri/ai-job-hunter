name: Hourly AI Recruiter Hunter

on:
  schedule:
    - cron: "15 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-recruiter-hunter
  cancel-in-progress: false

jobs:
  recruiter-hunt:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets
        env:
          APIFY_TOKEN_RESOLVED: ${{ secrets.APIFY_API_KEY || secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          missing=()
          [ -z "$APIFY_TOKEN_RESOLVED" ] && missing+=("APIFY_API_KEY (or APIFY_API_TOKEN)")
          if [ -z "$PROFILE_JSON" ] && [ ! -f "config/profile.private.json" ]; then
            missing+=("PROFILE_JSON")
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Actions secret(s): ${missing[*]}"
            echo "Configure these secrets in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # ------------------------------------------------------
      # RESTORE PERSISTENT STATE
      # ------------------------------------------------------

      - name: Restore recruiter state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: recruiter-state-${{ github.run_id }}
          restore-keys: |
            recruiter-state-

      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # RUN
      # ------------------------------------------------------

      - name: Run AI Recruiter Hunter
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY || secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_KEY || secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_API_KEY || secrets.APIFY_API_TOKEN || secrets.APIFY_TOKEN }}

          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}

          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          VIDEO_RESUME_URL: ${{ secrets.VIDEO_RESUME_URL }}

          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}

          AUTO_SEND: "false"

        run: |
          python agent/recruiter_main.py

      # ------------------------------------------------------
      # SAVE STATE
      # ------------------------------------------------------

      - name: Save recruiter state
        uses: actions/cache/save@v4
        with:
          path: state
          key: recruiter-state-${{ github.run_id }}
