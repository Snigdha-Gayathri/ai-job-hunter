name: Hourly AI Job Hunter

on:
  schedule:
    # Runs at minute 30 of every hour UTC, which corresponds to minute 00 of every hour in India Standard Time (IST, UTC+5:30)
    # E.g., 03:30 UTC = 09:00 IST, 04:30 UTC = 10:00 IST, 05:30 UTC = 11:00 IST.
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-job-hunter
  cancel-in-progress: false

jobs:
  job-hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persistent state prevents the same jobs from being
      # processed repeatedly across hourly workflow runs.
      - name: Restore job hunter state
        uses: actions/cache/restore@v4
        with:
          path: agent/state
          key: job-hunter-state-${{ github.run_id }}
          restore-keys: |
            job-hunter-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Job Hunter
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd agent
          python main.py

      # Save the updated seen-job database for the next hourly run.
      - name: Save job hunter state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: agent/state
          key: job-hunter-state-${{ github.run_id }}
